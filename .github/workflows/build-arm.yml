name: Build ARM & Push (U+202F fix)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本标签（同时写入 :latest 与 :<version>）'
        required: false
        default: 'u202f-fix'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm.yml'
      - 'Dockerfile.arm'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REPO: tianjian518/139cas
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉全量历史与 tags，保证 git describe 能取到最新版本号
          fetch-depth: 0

      - name: Determine version
        run: |
          set -e
          INPUT_VER="${{ github.event.inputs.version || '' }}"
          if [ -n "$INPUT_VER" ]; then
            VERSION="$INPUT_VER"
          else
            # 自动触发时取最新 tag，避免硬编码导致版本号失真
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          fi
          echo "Using version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download frontend dist (rolling, fallback to latest release)
        run: |
          set -e
          FRONTEND_REPO=OpenListTeam/OpenList-Frontend
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          fetch_rolling() {
            ASSET_URL=$(curl -fsSL -H "$AUTH" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$FRONTEND_REPO/releases/tags/rolling" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); urls=[a['browser_download_url'] for a in d.get('assets',[]) if 'openlist-frontend-dist' in a['name'] and 'lite' not in a['name'] and a['name'].endswith('.tar.gz')]; print(urls[0] if urls else '')" 2>/dev/null || true)
          }
          fetch_release() {
            ASSET_URL=$(curl -fsSL -H "$AUTH" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$FRONTEND_REPO/releases/latest" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); urls=[a['browser_download_url'] for a in d.get('assets',[]) if 'openlist-frontend-dist' in a['name'] and 'lite' not in a['name'] and a['name'].endswith('.tar.gz')]; print(urls[0] if urls else '')")
          }
          fetch_rolling
          if [ -z "$ASSET_URL" ]; then
            echo "rolling release unavailable, falling back to latest release"
            fetch_release
          fi
          echo "dist asset: $ASSET_URL"
          [ -n "$ASSET_URL" ] || { echo "no frontend asset found in rolling nor latest release"; exit 1; }
          curl -fsSL "$ASSET_URL" -o dist.tar.gz
          rm -rf public/dist && mkdir -p public/dist
          tar -zxvf dist.tar.gz -C public/dist
          rm -f dist.tar.gz

      - name: Cross-compile arm64 binary
        run: |
          set -e
          COMMIT=$(git rev-parse --short HEAD)
          CGO_ENABLED=0 GOARCH=arm64 go build -tags jsoniter \
            -ldflags="-w -s -X github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$VERSION -X github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$COMMIT" \
            -o openlist-arm64 .

      - name: Cross-compile arm/v7 binary
        run: |
          set -e
          COMMIT=$(git rev-parse --short HEAD)
          CGO_ENABLED=0 GOARCH=arm GOARM=7 go build -tags jsoniter \
            -ldflags="-w -s -X github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$VERSION -X github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$COMMIT" \
            -o openlist-armv7 .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.arm
          platforms: linux/arm64
          build-args: BIN=openlist-arm64
          push: true
          provenance: false
          tags: ${{ env.REPO }}:arm64

      - name: Build & push arm/v7
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.arm
          platforms: linux/arm/v7
          build-args: BIN=openlist-armv7
          push: true
          provenance: false
          tags: ${{ env.REPO }}:armv7

      - name: Reassemble multi-arch manifests (:latest + :version)
        run: |
          set -e
          REPO=${{ env.REPO }}
          VERSION=${{ env.VERSION }}
          # 拉取当前 :latest，保留除 arm64 / arm/v7 之外的其余架构 digest
          docker manifest inspect "$REPO:latest" > /tmp/cur.json
          NONARM=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cur.json'))
          out=[]
          seen=set()
          for m in d.get('manifests', []):
              p=m.get('platform')
              # 跳过无 OS/架构信息的索引或废料层，重组时带上会被 registry 拒收
              if not p:
                  continue
              a=p.get('architecture'); os_name=p.get('os','')
              v=p.get('variant','')
              # 只保留带完整平台信息的非 Arm 层，同时按 digest 去重
              if (a=='arm64' or (a=='arm' and v in ('v7','7',''))) or os_name=='unknown' or a=='unknown':
                  continue
              dg=m['digest']
              if dg not in seen:
                  seen.add(dg)
                  out.append(dg)
          print(' '.join(out))
          PY
          )
          echo "保留的其余架构 digest: $NONARM"
          for tag in latest "$VERSION"; do
            docker manifest rm "$REPO:$tag" 2>/dev/null || true
            docker manifest create "$REPO:$tag" \
              $(for dg in $NONARM; do echo "$REPO@$dg"; done) \
              "$REPO:arm64" "$REPO:armv7"
            docker manifest push "$REPO:$tag" --purge
            echo "已推送 manifest: $REPO:$tag"
          done
